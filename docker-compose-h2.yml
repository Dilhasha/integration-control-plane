# Docker Compose configuration for ICP with H2 database
# H2 database runs in server mode with initialization scripts
# Usage: docker compose -f docker-compose-h2.yml up --build

services:
  h2-db:
    build:
      context: ./icp_server/resources/db
      dockerfile: Dockerfile.h2
    container_name: icp-h2-db
    ports:
      - "9092:9092"  # H2 TCP server port
      - "8082:8082"  # H2 web console (optional)
    volumes:
      - h2-data:/opt/h2-data
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -an | grep 9092 | grep LISTEN"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - icp-network

  icp-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ICP_VERSION: 2.0.0-SNAPSHOT
    container_name: icp-server-h2
    ports:
      - "9445:9445"  # HTTPS
      - "9446:9446"  # GraphQL
      - "9449:9449"  # Observability
    volumes:
      # Mount logs directory for easy access
      - ./logs:/home/wso2/wso2-integration-control-plane-2.0.0-SNAPSHOT/logs
      # Mount H2 config override
      - ./config/h2-config.toml:/home/wso2/wso2-integration-control-plane-2.0.0-SNAPSHOT/conf/deployment.toml
    environment:
      - LOG_LEVEL=INFO
    depends_on:
      h2-db:
        condition: service_healthy
    networks:
      - icp-network
    restart: unless-stopped

volumes:
  h2-data:

networks:
  icp-network:
    driver: bridge
