# Docker Compose configuration for ICP with PostgreSQL database
# Usage: docker compose -f docker-compose-postgresql.yml up --build

services:
  postgresql-db:
    build:
      context: ./icp_server/resources/db
      dockerfile: Dockerfile.postgresql
    container_name: icp-postgresql-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my-secret-pw
      POSTGRES_DB: icp_database
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d icp_database"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - icp-network

  icp-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ICP_VERSION: 2.0.0-SNAPSHOT
    container_name: icp-server-postgresql
    ports:
      - "9445:9445"  # HTTPS
      - "9446:9446"  # GraphQL
      - "9449:9449"  # Observability
    volumes:
      # Mount logs directory for easy access
      - ./logs:/home/wso2/wso2-integration-control-plane-2.0.0-SNAPSHOT/logs
      # Mount PostgreSQL config override
      - ./config/postgresql-config.toml:/home/wso2/wso2-integration-control-plane-2.0.0-SNAPSHOT/conf/deployment.toml
    environment:
      - LOG_LEVEL=INFO
    depends_on:
      postgresql-db:
        condition: service_healthy
    networks:
      - icp-network
    restart: unless-stopped

volumes:
  postgresql-data:

networks:
  icp-network:
    driver: bridge
