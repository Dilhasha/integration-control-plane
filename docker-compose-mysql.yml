# Docker Compose configuration for ICP with MySQL database
# Usage: docker compose -f docker-compose-mysql.yml up --build

services:
  mysql-db:
    build:
      context: ./icp_server/resources/db
      dockerfile: Dockerfile
    container_name: icp-mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: icp_database
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - icp-network

  icp-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ICP_VERSION: 2.0.0-SNAPSHOT
    container_name: icp-server-mysql
    ports:
      - "9445:9445"  # HTTPS
      - "9446:9446"  # GraphQL
      - "9449:9449"  # Observability
    volumes:
      # Mount logs directory for easy access
      - ./logs:/home/wso2/wso2-integration-control-plane-2.0.0-SNAPSHOT/logs
      # Mount MySQL config override
      - ./config/mysql-config.toml:/home/wso2/wso2-integration-control-plane-2.0.0-SNAPSHOT/conf/deployment.toml
    environment:
      - LOG_LEVEL=INFO
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - icp-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  icp-network:
    driver: bridge
